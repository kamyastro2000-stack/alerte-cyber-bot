name: Alerte Cyber Bot

  on:
    schedule:
      - cron: '*/30 * * * *' # S'exécute toutes les 30 minutes
    workflow_dispatch: # Permet de lancer le bot manuellement pour tester

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.9'

        - name: Install dependencies
          run: |
            pip install -r requirements.txt

        - name: Run bot
          env:
            TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
            TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          run: python bot.py

        - name: Commit and push changes
          run: |
            git config --global user.name "CyberBot"
            git config --global user.email "bot@github.com"
            git add sent_articles.txt
            git commit -m "Update sent articles" || echo "No changes to commit"
            git push
